<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Meesho Clone</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="site-header"></div>
<main class="container" id="app">
<div class="narrow panel"><h1 class="page-title">Login</h1>
<div class="notice"><b>Demo only.</b> Accounts live in your browser's localStorage. This is not secure authentication. Try <code>demo@meesho.test</code> / <code>Demo@123</code>.</div>
<div id="form-msg" class="form-msg error hidden" role="alert"></div>
<form id="login-form" novalidate>
<div class="field"><label for="identity">Email or phone number</label><input id="identity" autocomplete="username"><small class="err" id="identity-err"></small></div>
<div class="field"><label for="password">Password</label><div class="pw-wrap"><input id="password" type="password" autocomplete="current-password"><button type="button" class="pw-toggle" data-toggle="password">Show</button></div><small class="err" id="password-err"></small></div>
<button class="btn btn-block" type="submit">Login</button></form>
<p style="text-align:center">New here? <a href="register.html" style="color:var(--pink);font-weight:600">Create an account</a></p></div>
</main>
<div id="site-footer"></div>
<script src="js/products.js"></script>
<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
