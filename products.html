<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | Meesho Clone</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="site-header"></div>
<main class="container" id="app">
<h1 class="page-title" id="list-title">All Products</h1>
<div class="list-layout">
<aside class="filters panel" id="filters" aria-label="Filters">
<h3>Category</h3><div id="f-cats"></div>
<h3>Price range (₹)</h3><div class="price-inputs"><input class="input" type="number" min="0" id="f-min" placeholder="Min" aria-label="Minimum price"><span>–</span><input class="input" type="number" min="0" id="f-max" placeholder="Max" aria-label="Maximum price"></div>
<h3>Rating</h3><label class="opt"><input type="radio" name="f-rating" value="0" checked> All ratings</label><label class="opt"><input type="radio" name="f-rating" value="4"> 4★ &amp; above</label><label class="opt"><input type="radio" name="f-rating" value="3"> 3★ &amp; above</label><label class="opt"><input type="radio" name="f-rating" value="2"> 2★ &amp; above</label>
<div style="margin-top:16px;display:flex;gap:8px"><button class="btn btn-outline btn-sm btn-block" id="clear-filters" type="button">Clear filters</button><button class="btn btn-sm filter-toggle" id="close-filters" type="button">Done</button></div>
</aside>
<section><div class="toolbar"><div><button class="btn btn-outline btn-sm filter-toggle" id="open-filters" type="button">☰ Filters</button> <b id="count">0</b> <span class="muted">products</span></div>
<label class="muted">Sort by <select class="input" id="sort" style="width:auto;display:inline-block"><option value="relevance">Relevance</option><option value="price-asc">Price: Low to High</option><option value="price-desc">Price: High to Low</option><option value="rating">Rating</option><option value="discount">Discount</option><option value="newest">Newest</option><option value="reviews">Popularity</option></select></label></div>
<div class="chips" id="chips"></div><div class="product-grid" id="grid"></div>
<div style="text-align:center;margin-top:20px"><button class="btn btn-outline hidden" id="load-more" type="button">Load more</button></div></section></div>
</main>
<div id="site-footer"></div>
<script src="js/products.js"></script>
<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/product-list.js"></script>
</body>
</html>
